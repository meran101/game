<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة ذاكرة الألوان</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f6;--card:#fff;--tx:#18181b;--ac:#6d5efc;--bd:#d9d9e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e11;--card:#18181d;--tx:#f2f2f5;--bd:#2c2c34}}
:root[data-theme="dark"]{--bg:#0e0e11;--card:#18181d;--tx:#f2f2f5;--bd:#2c2c34}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-align:center}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
button,input{font:inherit;border-radius:12px}
input[type=text]{padding:12px;border:1px solid var(--bd);width:80%;background:var(--bg);color:var(--tx);margin:4px 0}
.btn{background:var(--ac);color:#fff;border:0;padding:12px 28px;font-weight:bold;cursor:pointer;margin:8px}
.sw{height:34vh;min-height:190px;border-radius:18px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:bold;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.two{display:flex;gap:10px}.two>div{flex:1}
.two .sw{height:150px;min-height:0;font-size:16px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--ac);width:100%;transition:width 1s linear}
.sl{margin:14px 0;text-align:right}.sl label{display:flex;justify-content:space-between;font-size:14px;opacity:.8}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;margin:6px 0;direction:ltr;border:1px solid var(--bd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer}
table{width:100%;border-collapse:collapse}td{padding:7px;border-bottom:1px solid var(--bd)}
small{opacity:.7}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ===== ألوان ===== */
const rgb=(h,s,v)=>{s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)].map(x=>Math.round(x*255))};
const css=c=>`rgb(${rgb(c.h,c.s,c.b).join(",")})`;
const lab=([r,g,b])=>{const l=c=>{c/=255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4};const R=l(r),G=l(g),B=l(b);const X=(.4124*R+.3576*G+.1805*B)/.95047,Y=.2126*R+.7152*G+.0722*B,Z=(.0193*R+.1192*G+.9505*B)/1.08883;const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(Y)-16,500*(f(X)-f(Y)),200*(f(Y)-f(Z))]};
const score=(t,g)=>{const a=lab(rgb(t.h,t.s,t.b)),b=lab(rgb(g.h,g.s,g.b));const dE=Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);return Math.round(10*Math.exp(-dE/25)*100)/100};
const hash=s=>{let h=1779033703;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),3432918353),h=h<<13|h>>>19;return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const makeTargets=r=>Array.from({length:5},()=>({h:Math.floor(r()*360),s:25+Math.floor(r()*76),b:25+Math.floor(r()*76)}));
/* ===== الحالة ===== */
let room="",name="",round=0,targets=[],pts=[0,0,0,0,0],all=[],g={h:180,s:50,b:50};
const total=()=>Math.round(pts.reduce((a,b)=>a+b,0)*100)/100;
/* ===== الشاشات ===== */
function home(){setTimeout(bindSetup,0);
 $.innerHTML=`<h1>🎨 لعبة ذاكرة الألوان</h1><div class="card"><p>٥ جولات: يظهر لك لون لمدة ٥ ثوانٍ فقط، ثم يختفي، وعليك إعادة صنعه من الذاكرة بثلاثة أشرطة: <b>الصبغة</b> و<b>التشبّع</b> و<b>السطوع</b>. كل جولة من ١٠ نقاط (المجموع ٥٠)، وكلما اقترب لونك من الأصلي زادت نقاطك.</p><input type="text" id="nm" maxlength="14" placeholder="اكتب اسمك"><br><input type="text" id="rm" maxlength="12" placeholder="رمز الغرفة (اتركه فارغاً للعب منفرداً)"><br><small>كل من يدخل نفس الرمز يرى نفس الألوان</small><br><button class="btn" id="go">ابدأ</button></div>${setup()}${board()}`;
 document.getElementById("go").onclick=()=>{name=document.getElementById("nm").value.trim()||"لاعب";room=document.getElementById("rm").value.replace(/[^A-Za-z0-9_-]/g,"");targets=makeTargets(room?rng(hash(room)):Math.random);round=0;pts=[0,0,0,0,0];if(room)startPoll();memorize()}}
function memorize(){let t=5;const c=targets[round];
 $.innerHTML=`<h1>الجولة ${round+1} / 5</h1><div class="card"><b>احفظ هذا اللون!</b><div class="sw" id="sw" style="background:${css(c)}">${t}</div><div class="bar"><i id="pb"></i></div></div>`;
 requestAnimationFrame(()=>{const p=document.getElementById("pb");if(p){p.style.transitionDuration="5s";p.style.width="0"}});
 const iv=setInterval(()=>{t--;const s=document.getElementById("sw");if(!s){clearInterval(iv);return}if(t<=0){clearInterval(iv);guess()}else s.textContent=t},1000)}
function guess(){g={h:180,s:50,b:50};
 $.innerHTML=`<h1>الجولة ${round+1} / 5</h1><div class="card"><b>أعد صنع اللون من ذاكرتك</b><div class="sw" id="sw"></div>
 <div class="sl"><label><span>الصبغة</span><span id="vh"></span></label><input type="range" id="h" min="0" max="360"></div>
 <div class="sl"><label><span>التشبّع</span><span id="vs"></span></label><input type="range" id="s" min="0" max="100"></div>
 <div class="sl"><label><span>السطوع</span><span id="vb"></span></label><input type="range" id="b" min="0" max="100"></div>
 <button class="btn" id="ok">تأكيد</button></div>`;
 const upd=()=>{document.getElementById("sw").style.background=css(g);
  for(const k of["h","s","b"]){const el=document.getElementById(k);el.value=g[k];document.getElementById("v"+k).textContent=Math.round(g[k])}
  document.getElementById("h").style.background="linear-gradient(to right,"+[0,60,120,180,240,300,360].map(h=>css({h,s:g.s,b:g.b})).join(",")+")";
  document.getElementById("s").style.background=`linear-gradient(to right,${css({h:g.h,s:0,b:g.b})},${css({h:g.h,s:100,b:g.b})})`;
  document.getElementById("b").style.background=`linear-gradient(to right,${css({h:g.h,s:g.s,b:0})},${css({h:g.h,s:g.s,b:100})})`};
 for(const k of["h","s","b"])document.getElementById(k).oninput=e=>{g[k]=+e.target.value;upd()};
 upd();document.getElementById("ok").onclick=reveal}
function reveal(){const c=targets[round],sc=score(c,g);pts[round]=sc;save();
 const em=sc>=8?"🎉 ممتاز!":sc>=5?"👍 جيد!":"😅 حاول مجدداً";
 $.innerHTML=`<h1>${em} ${sc.toFixed(2)} / 10</h1><div class="card"><div class="two"><div><small>لونك</small><div class="sw" style="background:${css(g)}"></div></div><div><small>اللون الصحيح</small><div class="sw" style="background:${css(c)}"></div></div></div><p><small>الصحيح: ${c.h}° · ${c.s}% · ${c.b}%<br>لونك: ${Math.round(g.h)}° · ${Math.round(g.s)}% · ${Math.round(g.b)}%</small></p><p>مجموعك: <b>${total().toFixed(2)}</b> / 50</p><button class="btn" id="nx">${round<4?"الجولة التالية":"النتيجة النهائية"}</button></div>`;
 document.getElementById("nx").onclick=()=>{if(round<4){round++;memorize()}else end()}}
function end(){$.innerHTML=`<h1>🏆 انتهت اللعبة</h1><div class="card"><p>نقاطك: <b>${total().toFixed(2)}</b> / 50</p><button class="btn" id="re">العب مرة أخرى</button></div>${board()}`;document.getElementById("re").onclick=async()=>{await leave();home()}}
function board(){const rows=[...all].sort((a,b)=>b.total-a.total);
 return `<div class="card"><b>🏅 لوحة المتصدرين</b>${room?"<br><small>الغرفة: "+esc(room)+"</small>":""}<table>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${Number(r.total).toFixed(2)}</td></tr>`).join("")||"<tr><td><small>لا أحد بعد</small></td></tr>"}</table></div>`}
/* ===== Firebase ===== */
const DEFAULT_DB=""; // اختياري: ضع رابط Firebase هنا ليعمل تلقائياً لكل اللاعبين
let DBURL=DEFAULT_DB;try{const m=location.hash.match(/db=([^&]+)/);if(m){DBURL=decodeURIComponent(m[1]);localStorage.setItem("dburl",DBURL)}else DBURL=localStorage.getItem("dburl")||DEFAULT_DB}catch(e){}
let uid=(()=>{try{let u=localStorage.getItem("uid");if(!u){u=Math.random().toString(36).slice(2,10);localStorage.setItem("uid",u)}return u}catch(e){return Math.random().toString(36).slice(2,10)}})();
const url=p=>DBURL.replace(/\/$/,"")+"/rooms/"+room+"/"+p+".json";
const live=()=>DBURL.startsWith("http");
async function save(){if(!live()||!room)return;try{await fetch(url("players/"+uid),{method:"PUT",body:JSON.stringify({name,pts,total:total()})})}catch(e){console.error(e)}}
async function leave(){if(!live()||!room)return;try{await fetch(url("players/"+uid),{method:"DELETE",keepalive:true})}catch(e){}}
window.addEventListener("pagehide",()=>{if(!live()||!room)return;try{fetch(url("players/"+uid),{method:"DELETE",keepalive:true})}catch(e){}});
let timer=null;
function startPoll(){if(!live()||timer)return;const t=async()=>{try{const r=await fetch(url("players"));const d=await r.json();all=d?Object.values(d):[];refreshBoard()}catch(e){}};t();timer=setInterval(t,3000)}
function refreshBoard(){const h=$.querySelectorAll(".card");const last=h[h.length-1];if(last&&/لوحة/.test(last.innerHTML))last.outerHTML=board()}
function setup(){return live()?`<button class="btn" id="inv">🔗 نسخ رابط الدعوة للأصدقاء</button>`:`<div class="card"><small>للعب الجماعي: الصق رابط Firebase هنا (راجع ملف README)</small><br><input type="text" id="fb" placeholder="https://xxxx-default-rtdb.firebaseio.com"><br><button class="btn" id="sv">حفظ</button></div>`}
function bindSetup(){const i=document.getElementById("inv"),v=document.getElementById("sv");
if(i)i.onclick=()=>{const l=location.href.split("#")[0]+"#db="+encodeURIComponent(DBURL);(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>alert("تم النسخ! أرسله لأصدقائك"),()=>prompt("انسخ الرابط:",l))};
if(v)v.onclick=()=>{const x=document.getElementById("fb").value.trim();if(!/^https:\/\//.test(x))return alert("الرابط غير صحيح");DBURL=x;try{localStorage.setItem("dburl",x)}catch(e){}home()}}
home();
</script>
</body>
</html>
