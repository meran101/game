<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>مستشفى المجانين</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--card:#111114;--tx:#f4f4f6;--ac:#fff;--act:#000;--bd:#26262c;--mut:#9a9aa5}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f5f7;--card:#fff;--tx:#111;--ac:#111;--act:#fff;--bd:#dcdce2;--mut:#666}}
:root[data-theme="light"]{--bg:#f5f5f7;--card:#fff;--tx:#111;--ac:#111;--act:#fff;--bd:#dcdce2;--mut:#666}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;text-align:center}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:14px 0 4px;letter-spacing:-.5px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}
button,input{font:inherit;border-radius:14px}
input[type=text],input[type=password]{padding:13px;border:1px solid var(--bd);width:100%;background:var(--bg);color:var(--tx);margin:5px 0;text-align:center}
.btn{background:var(--ac);color:var(--act);border:0;padding:14px 20px;font-weight:bold;cursor:pointer;width:100%;margin:6px 0}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.sw{position:relative;height:36vh;min-height:200px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--bd);padding:10px}.sw svg{height:100%;width:auto;max-width:100%}.cd{position:absolute;top:8px;left:14px;font-size:34px;font-weight:bold}
.two{display:flex;gap:10px}.two>div{flex:1}
.two .sw{height:150px;min-height:0;font-size:16px}
.bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--ac);width:100%;transition-property:width;transition-timing-function:linear}
.sl{margin:14px 0}.sl label{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;border-radius:16px;margin:6px 0;direction:ltr;border:1px solid var(--bd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #333;cursor:pointer}
table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid var(--bd)}
small{color:var(--mut)}
.chips{display:flex;gap:6px;justify-content:center;margin:10px 0}.chips i{width:46px;height:46px;display:block}.chips svg{width:100%;height:100%}
.top{position:relative;display:flex;align-items:center;justify-content:center;min-height:64px;padding:0 72px;margin:6px 0 4px}
.top h1{font-size:22px;margin:0;line-height:1.4}
.pf{position:absolute;left:0;top:50%;transform:translateY(-50%);width:60px;height:60px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--bd)}
</style>
</head>

const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rgb=(h,s,v)=>{s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5),f(3),f(1)].map(x=>Math.round(x*255))};

const lab=([r,g,b])=>{const l=c=>{c/=255;return c<=.04045?c/12.92:((c+.055)/1.055)**2.4};const R=l(r),G=l(g),B=l(b);const X=(.4124*R+.3576*G+.1805*B)/.95047,Y=.2126*R+.7152*G+.0722*B,Z=(.0193*R+.1192*G+.9505*B)/1.08883;const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(Y)-16,500*(f(X)-f(Y)),200*(f(Y)-f(Z))]};
const score=(t,g)=>{const a=lab(rgb(t.h,t.s,t.b)),b=lab(rgb(g.h,g.s,g.b));return Math.round(10*Math.exp(-Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])/25)*100)/100};
const hash=s=>{let h=1779033703;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),3432918353),h=h<<13|h>>>19;return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* شخصيات محذوفة (الخنزير): جسم مدوّر + فم بيضاوي (خطم) + بدون زوائد أو بأذنين مدببتين */
const banned=id=>[0,1,5].includes(id%10)&&[0,2].includes(Math.floor(id/10)%10)&&(id*7)%3===1;
const pickCh=r=>{let c;do c=Math.floor(r()*500);while(banned(c));return c};
const makeTargets=r=>Array.from({length:5},()=>({h:Math.floor(r()*360),s:25+Math.floor(r()*76),b:25+Math.floor(r()*76),ch:pickCh(r)}));
/* ===== ٥٠٠ شخصية (١٠ أجسام × ١٠ زوائد × ٥ وجوه) ===== */
const BODY=[`<ellipse cx="100" cy="125" rx="58" ry="50"/>`,`<circle cx="100" cy="125" r="52"/>`,`<rect x="45" y="80" width="110" height="95" rx="30"/>`,`<polygon points="100,68 160,175 40,175"/>`,`<path d="M100 72C140 72 150 110 160 150C165 180 35 180 40 150C50 110 60 72 100 72Z"/>`,`<rect x="50" y="75" width="100" height="100" rx="50"/>`,`<polygon points="100,68 160,125 100,182 40,125"/>`,`<polygon points="70,72 130,72 165,125 130,178 70,178 35,125"/>`,`<path d="M100 68C150 68 160 130 150 160C140 185 60 185 50 160C40 130 50 68 100 68Z"/>`,`<polygon points="62,75 138,75 165,175 35,175"/>`];

/* ألوان ثابتة للأطراف والجزء السفلي (لا تتغير مع الجولة) */
const PAL=["#8b5a2b","#2b2b33","#f0f0f0","#d94b4b","#3b6fd9","#2f9e5b","#f2c230","#8e4bd9"];
const charSvg=id=>{
 const b=id%10,t=Math.floor(id/10)%10;
 const cTop=PAL[(id*3+1)%8], cLegs=PAL[(id*5+2)%8], cBand=PAL[(id*7+3)%8];
 return `<svg viewBox="0 0 200 200" stroke="#1b1b1f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

 <g clip-path="url(#cp${b})" fill="${cBand}" stroke="none"><rect x="0" y="148" width="200" height="60"/></g>
 <g fill="none">${BODY[b]}</g>
 ${EYES[Math.floor(id/100)%5]}${MOUTH[(id*7)%3]}</svg>`};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let mode="solo",room="",name=ls("name")||"",memT=5,round=0,targets=[],pts=[0,0,0,0,0],all=[],g={h:180,s:50,b:50},hashRoom="";
const total=()=>Math.round(pts.reduce((a,b)=>a+b,0)*100)/100;
const today=()=>new Date().toISOString().slice(0,10);
const modeName=()=>mode==="daily"?"التحدي اليومي":mode==="multi"?"لعب جماعي":"منفرد "+(memT>3?"سهل":"صعب");
/* ===== الرئيسية ===== */
function home(){setTimeout(bindHome,0);
 $.innerHTML=`<p class="sub">🎨 لعبة ذاكرة الألوان: احفظ لون الشخصية، ثم أعد صنعه من ذاكرتك</p>
 <div class="card"><input type="text" id="nm" maxlength="14" placeholder="اكتب اسمك" value="${esc(name)}" readonly></div>
 <div class="card"><b>منفرد</b><br><small>٥ جولات، ١٠ نقاط لكل جولة</small><div class="row"><button class="btn" id="se">سهل (٥ ثوانٍ)</button><button class="btn" id="sh">صعب (ثانيتان)</button></div></div>
 <div class="card"><b>التحدي اليومي</b><br><small>الجميع يرى نفس الألوان اليوم</small><button class="btn" id="dy">ابدأ التحدي</button></div>
 <div class="card"><b>لعب جماعي</b><br><small>أنشئ لعبة وأرسل الرابط، أو أدخل رمز غرفة صديقك</small><input type="text" id="rm" maxlength="12" placeholder="رمز الغرفة" value="${esc(hashRoom)}"><div class="row"><button class="btn" id="mk">إنشاء لعبة</button><button class="btn alt" id="jn">انضمام</button></div></div>${setup()}<button class="btn alt" id="lo">تسجيل الخروج</button>`}
function bindHome(){const nm=()=>{name=document.getElementById("nm").value.trim()||"لاعب";ls("name",name)};
 const q=id=>document.getElementById(id);
 q("lo").onclick=()=>{try{sessionStorage.removeItem("user")}catch(e){}name="";login()};
 q("se").onclick=()=>{nm();start("solo",5,"")};
 q("sh").onclick=()=>{nm();start("solo",2,"")};
 q("dy").onclick=()=>{nm();start("daily",5,"daily-"+today())};
 q("mk").onclick=()=>{nm();const c=Math.random().toString(36).slice(2,7);start("multi",5,c)};
 q("jn").onclick=()=>{nm();const c=q("rm").value.replace(/[^A-Za-z0-9_-]/g,"");if(!c)return alert("اكتب رمز الغرفة");start("multi",5,c)};
 bindSetup()}
function start(m,t,r){wipe();clearInterval(timer);mode=m;memT=t;room=r;targets=makeTargets(r?rng(hash(r)):Math.random);round=0;pts=[0,0,0,0,0];all=[];if(room)startPoll();memorize()}
/* ===== الجولات ===== */
function memorize(){let t=memT;const c=targets[round];
 $.innerHTML=`<h1>الجولة ${round+1} / 5</h1><p class="sub">${modeName()}</p><div class="card"><b>احفظ هذا اللون!</b><div class="sw" id="sw" style="--c:${css(c)}">${charSvg(c.ch)}<span class="cd" id="cd">${t}</span></div><div class="bar"><i id="pb"></i></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const p=document.getElementById("pb");if(p){p.style.transitionDuration=memT+"s";p.style.width="0"}}));
 const iv=setInterval(()=>{t--;const s=document.getElementById("cd");if(!s){clearInterval(iv);return}if(t<=0){clearInterval(iv);guess()}else s.textContent=t},1000)}
function guess(){g={h:180,s:50,b:50};
 $.innerHTML=`<h1>الجولة ${round+1} / 5</h1><div class="card"><b>أعد صنع اللون</b><div class="sw" id="sw">${charSvg(targets[round].ch)}</div>
 <div class="sl"><label><span>الصبغة</span><span id="vh"></span></label><input type="range" id="h" min="0" max="360"></div>
 <div class="sl"><label><span>التشبّع</span><span id="vs"></span></label><input type="range" id="s" min="0" max="100"></div>
 <div class="sl"><label><span>السطوع</span><span id="vb"></span></label><input type="range" id="b" min="0" max="100"></div>
 <button class="btn" id="ok">تأكيد</button></div>`;
 const upd=()=>{document.getElementById("sw").style.setProperty("--c",css(g));
  for(const k of["h","s","b"]){document.getElementById(k).value=g[k];document.getElementById("v"+k).textContent=Math.round(g[k])}
  document.getElementById("h").style.background="linear-gradient(to right,"+[0,60,120,180,240,300,360].map(h=>css({h,s:g.s,b:g.b})).join(",")+")";
  document.getElementById("s").style.background=`linear-gradient(to right,${css({h:g.h,s:0,b:g.b})},${css({h:g.h,s:100,b:g.b})})`;
  document.getElementById("b").style.background=`linear-gradient(to right,${css({h:g.h,s:g.s,b:0})},${css({h:g.h,s:g.s,b:100})})`};
 for(const k of["h","s","b"])document.getElementById(k).oninput=e=>{g[k]=+e.target.value;upd()};
 upd();document.getElementById("ok").onclick=reveal}
function reveal(){const c=targets[round],sc=score(c,g);pts[round]=sc;save();
 const em=sc>=8?"🎉 ممتاز!":sc>=5?"👍 جيد!":"😅 حاول مجدداً";
 $.innerHTML=`<h1>${em} ${sc.toFixed(2)} / 10</h1><div class="card"><div class="two"><div><small>لونك</small><div class="sw" style="--c:${css(g)}">${charSvg(c.ch)}</div></div><div><small>اللون الصحيح</small><div class="sw" style="--c:${css(c)}">${charSvg(c.ch)}</div></div></div><p><small>الصحيح: ${c.h}° · ${c.s}% · ${c.b}%<br>لونك: ${Math.round(g.h)}° · ${Math.round(g.s)}% · ${Math.round(g.b)}%</small></p><p>مجموعك: <b>${total().toFixed(2)}</b> / 50</p><button class="btn" id="nx">${round<4?"الجولة التالية":"النتيجة النهائية"}</button></div>`;
 document.getElementById("nx").onclick=()=>{if(round<4){round++;memorize()}else end()}}
function end(){if(mode==="daily")ls("daily",today());if(!room||!live())all=[{name,total:total()}];
 $.innerHTML=`<h1>🏆 انتهت اللعبة</h1><p class="sub">${modeName()}</p><div class="card"><p style="font-size:34px;margin:4px"><b>${total().toFixed(2)}</b> / 50</p><div class="chips">${targets.map(c=>`<i style="--c:${css(c)}">${charSvg(c.ch)}</i>`).join("")}</div><button class="btn" id="sh">مشاركة النتيجة</button>${room&&mode==="multi"&&live()?`<button class="btn alt" id="inv">🔗 دعوة صديق لنفس الألوان</button>`:""}<button class="btn alt" id="re">القائمة الرئيسية</button></div>${board()}`;
 document.getElementById("sh").onclick=()=>{const t=`حصلت على ${total().toFixed(2)} / 50 في لعبة ذاكرة الألوان! هل تتفوق عليّ؟\n`+location.href.split("#")[0];navigator.share?navigator.share({text:t}).catch(()=>{}):copy(t)};
 const i=document.getElementById("inv");if(i)i.onclick=()=>copy(location.href.split("#")[0]+"#db="+encodeURIComponent(DBURL)+"&room="+room);
 document.getElementById("re").onclick=()=>{clearInterval(timer);wipe();room="";all=[];hashRoom="";home()}}
const copy=t=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("تم النسخ!"),()=>prompt("انسخ:",t));
function board(){const rows=[...all].sort((a,b)=>b.total-a.total).slice(0,30);
 return `<div class="card"><b>🏅 لوحة المتصدرين</b>${room?"<br><small>"+(mode==="daily"?"اليومي":"الغرفة: "+esc(room))+"</small>":""}<table>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${Number(r.total).toFixed(2)}</td></tr>`).join("")||"<tr><td><small>لا أحد بعد</small></td></tr>"}</table></div>`}
/* ===== Firebase ===== */
const DEFAULT_DB=""; // اختياري: ضع رابط Firebase هنا ليعمل تلقائياً لكل اللاعبين
let DBURL=DEFAULT_DB;try{const m=location.hash.match(/db=([^&]+)/);if(m){DBURL=decodeURIComponent(m[1]);ls("dburl",DBURL)}else DBURL=ls("dburl")||DEFAULT_DB;const r=location.hash.match(/room=([A-Za-z0-9_-]+)/);if(r)hashRoom=r[1]}catch(e){}
let uid=ls("uid")||(()=>{const u=Math.random().toString(36).slice(2,10);ls("uid",u);return u})();
const url=p=>DBURL.replace(/\/$/,"")+"/rooms/"+room+"/"+p+".json";
const live=()=>DBURL.startsWith("http");
async function save(){if(!live()||!room)return;try{await fetch(url("players/"+uid),{method:"PUT",body:JSON.stringify({name,pts,total:total()})})}catch(e){console.error(e)}}
function wipe(){if(!live()||!room)return;try{fetch(url("players/"+uid),{method:"DELETE",keepalive:true})}catch(e){}}
window.addEventListener("pagehide",wipe);
let timer=null;
function startPoll(){if(!live())return;clearInterval(timer);const t=async()=>{try{const r=await fetch(url("players"));const d=await r.json();all=d?Object.values(d):[];refreshBoard()}catch(e){}};t();timer=setInterval(t,3000)}
function refreshBoard(){const h=$.querySelectorAll(".card");const last=h[h.length-1];if(last&&/لوحة/.test(last.innerHTML))last.outerHTML=board()}
function setup(){return live()?`<button class="btn alt" id="inv">🔗 نسخ رابط الدعوة (يحمل إعداد اللعب الجماعي)</button>`:`<div class="card"><small>للعب الجماعي واليومي مع الآخرين: الصق رابط Firebase (راجع ملف README)</small><input type="text" id="fb" placeholder="https://xxxx-default-rtdb.firebaseio.com"><button class="btn" id="sv">حفظ</button></div>`}
function bindSetup(){const i=document.getElementById("inv"),v=document.getElementById("sv");
 if(i)i.onclick=()=>copy(location.href.split("#")[0]+"#db="+encodeURIComponent(DBURL));
 if(v)v.onclick=()=>{const x=document.getElementById("fb").value.trim();if(!/^https:\/\//.test(x))return alert("الرابط غير صحيح");DBURL=x;ls("dburl",x);home()}}

/* ===== تسجيل الدخول ===== */
function sha256(str){
 const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
 const bytes=Array.from(new TextEncoder().encode(str));
 const l=bytes.length*8;
 bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
 for(const v of[Math.floor(l/4294967296),l>>>0])for(let i=3;i>=0;i--)bytes.push((v>>>(i*8))&255);
 const K=[];let H=[];
 for(let n=2,c=0;c<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break}
  if(p){if(c<8)H[c]=((Math.pow(n,.5)%1)*4294967296)|0;K[c]=((Math.pow(n,1/3)%1)*4294967296)|0;c++}}
 for(let i=0;i<bytes.length;i+=64){
  const w=[];for(let j=0;j<16;j++)w[j]=(bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3];
  for(let j=16;j<64;j++){const s0=rotr(w[j-15],7)^rotr(w[j-15],18)^(w[j-15]>>>3),s1=rotr(w[j-2],17)^rotr(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)|0}
  let[a,b,c,d,e,f,g,h]=H;
  for(let j=0;j<64;j++){const S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[j]+w[j])|0,S0=rotr(a,2)^rotr(a,13)^rotr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  H=H.map((v,k)=>(v+[a,b,c,d,e,f,g,h][k])|0)}
 return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")
}
const SALT="cm-v1:";
const USERS={"meran": "02602dbe24f1ee297e77b33bd1aab1d480618a32ae31197712a7615ac09c5609", "andryan": "3e5508b10c16fbc242590a2c09b5a8a4880b38ddb975aaeb59c27b2d3e540997", "martin": "153b7bc6df2b50953c74d9398720d0d92ec972a7314775331e6954ac2e8d4ec8"};
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}};
function login(){
 $.innerHTML=`<div class="card"><b>تسجيل الدخول</b><br><small>أدخل اسمك والكود الخاص بك</small><input type="text" id="ln" placeholder="الاسم" autocomplete="off" autocapitalize="off" spellcheck="false"><input type="password" id="lc" placeholder="الكود" autocomplete="off" autocapitalize="off"><p id="le" style="color:#e5484d;min-height:22px;margin:8px 0"></p><button class="btn" id="lg">دخول</button></div>`;
 const go=()=>{const n=document.getElementById("ln").value.trim().toLowerCase(),c=document.getElementById("lc").value.trim().toUpperCase();
  if(USERS[n]&&sha256(SALT+n+":"+c)===USERS[n]){ss("user",n);name=n;home()}
  else{document.getElementById("le").textContent="الاسم أو الكود غير صحيح";document.getElementById("lc").value=""}};
 document.getElementById("lg").onclick=go;
 for(const id of["ln","lc"])document.getElementById(id).onkeydown=e=>{if(e.key==="Enter")go()}}
const u0=ss("user");
if(u0&&USERS[u0]){name=u0;home()}else login();
</script>
